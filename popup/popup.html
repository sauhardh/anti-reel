<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Reel Hider</title>
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <h1 style="margin: 0px 5px; width: full; padding: 15px 0px">Anti Reel</h1>

    <div class="container">
      <div class="youtube-shorts platform-container">
        <p>Hide Youtube Shorts</p>
        <label class="switch">
          <input type="checkbox" id="toggleYoutube" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="facebook-reels platform-container">
        <p>Hide Facebook Reels</p>
        <label class="switch">
          <input type="checkbox" id="toggleFacebook" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="insta-reels platform-container">
        <p>Hide Instagram Reels</p>
        <label class="switch">
          <input type="checkbox" id="toggleInstagram" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div
      class="footer"
      style="
        display: flex-col;
        align-items: center;
        justify-content: space-around;
        padding: 15px 0px;
        margin-top: 10px;
        color: #3d444d;
      "
    >
      <a
        alt="sauhardhakafle.com.np"
        href="https://buymemomo.com/sauhardha"
        style="color: #008000"
        >BuyMeMomo</a
      >
      <p style="font-style: italic">Sauhardha Kafle</p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
